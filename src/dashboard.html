<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EvalKit — Trace Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #0f1117;
  --bg2:     #0b0d14;
  --surf:    #151821;
  --surf2:   #1c1f2e;
  --surf3:   #232740;
  --border:  #252839;
  --border2: #303450;
  --text:    #b8c0d8;
  --muted:   #6b7399;
  --dim:     #3a4060;
  --accent:  #6366f1;
  --aglow:   rgba(99,102,241,.15);
  --abright: #818cf8;
  --green:   #9ece6a;
  --gdim:    rgba(158,206,106,.09);
  --red:     #f7768e;
  --rdim:    rgba(247,118,142,.09);
  --yellow:  #e0af68;
  --cyan:    #7dcfff;
  --purple:  #bb9af7;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  background: var(--bg);
  color: var(--text);
  display: grid;
  grid-template-columns: 260px 1fr;
  height: 100vh;
}

::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* ── Sidebar ──────────────────────────────────────────── */
#sidebar {
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}
#sidebar::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(var(--border) 1px, transparent 1px);
  background-size: 18px 18px;
  opacity: .45;
  pointer-events: none;
}

#sb-head {
  padding: 14px;
  border-bottom: 1px solid var(--border);
  position: relative;
  z-index: 1;
}
.wordmark {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 14px;
}
.wm-icon {
  width: 26px; height: 26px;
  background: var(--accent);
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  color: #fff;
  box-shadow: 0 0 12px rgba(99,102,241,.45);
  flex-shrink: 0;
}
.wm-name { font-size: 13px; font-weight: 600; color: #e0e4ff; letter-spacing: .4px; }
.wm-sub  { font-size: 9px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; margin-top: 1px; }

.sb-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
.cap { font-size: 9px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--muted); }

.icon-btn {
  background: none;
  border: none;
  color: var(--dim);
  cursor: pointer;
  font-family: inherit;
  font-size: 10px;
  padding: 3px 7px;
  border-radius: 3px;
  transition: all .12s;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.icon-btn:hover { color: var(--text); background: var(--surf2); }

#last-ref { font-size: 9px; color: var(--dim); }

#trace-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
  position: relative;
  z-index: 1;
}

.tr-item {
  padding: 9px 10px;
  border-radius: 5px;
  cursor: pointer;
  border: 1px solid transparent;
  margin-bottom: 2px;
  transition: all .1s;
  position: relative;
}
.tr-item:hover { background: var(--surf); border-color: var(--border); }
.tr-item.active {
  background: var(--surf2);
  border-color: var(--accent);
}
.tr-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 65%;
  background: var(--accent);
  border-radius: 0 2px 2px 0;
  box-shadow: 0 0 7px var(--accent);
}
.tr-short { font-size: 11px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
.tr-full  { font-size: 9px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

#sb-foot {
  padding: 9px 14px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 9px;
  color: var(--dim);
  position: relative;
  z-index: 1;
}
.live-dot {
  display: inline-block;
  width: 5px; height: 5px;
  background: var(--green);
  border-radius: 50%;
  margin-right: 5px;
  box-shadow: 0 0 5px var(--green);
  animation: blink 2.2s ease infinite;
}
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.3; } }

.demo-link {
  font-size: 9px;
  color: var(--accent);
  text-decoration: none;
  padding: 2px 6px;
  border: 1px solid rgba(99,102,241,.3);
  border-radius: 3px;
}
.demo-link:hover { background: var(--aglow); }

/* ── Main panel ───────────────────────────────────────── */
#main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Panel header */
.p-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
  flex-shrink: 0;
}
.p-title { font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); }
#tp-id {
  font-size: 10px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 380px;
}

/* Stats bar */
#stats-bar {
  display: flex;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  overflow-x: auto;
}
.sb-blk {
  padding: 8px 18px;
  border-right: 1px solid var(--border);
  flex-shrink: 0;
}
.sv { font-size: 18px; font-weight: 600; color: #e0e4ff; line-height: 1; }
.sl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .9px; margin-top: 3px; }
.sv.accent { color: var(--abright); }
.sv.green  { color: var(--green); }
.sv.red    { color: var(--red); }
.sv.yellow { color: var(--yellow); }

/* Body / waterfall */
#trace-body { flex: 1; overflow-y: auto; padding: 12px; }

#no-trace {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 8px;
  color: var(--dim);
}
.nt-icon { font-size: 22px; opacity: .2; }

#waterfall { display: flex; flex-direction: column; gap: 4px; }

/* Span rows */
.sp-row {
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  background: var(--surf);
  transition: border-color .12s;
}
.sp-row:hover { border-color: var(--border2); }

.sp-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  cursor: pointer;
  user-select: none;
}

.sp-ico {
  width: 22px; height: 22px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  flex-shrink: 0;
}
.ico-llm  { background: rgba(99,102,241,.15); color: var(--abright); }
.ico-tool { background: rgba(187,154,247,.15); color: var(--purple); }
.ico-root { background: rgba(125,207,255,.12); color: var(--cyan); }
.ico-misc { background: var(--surf2); color: var(--muted); }

.sp-op { flex: 1; font-size: 11px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.chip {
  display: inline-flex;
  align-items: center;
  padding: 1px 7px;
  border-radius: 3px;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .4px;
  text-transform: uppercase;
  flex-shrink: 0;
}
.chip-openai    { background: rgba(16,163,127,.12); color: #10a37f; }
.chip-anthropic { background: rgba(217,119,6,.12);  color: #d97706; }
.chip-llm_call  { background: rgba(99,102,241,.12); color: var(--abright); }
.chip-tool_call { background: rgba(187,154,247,.12); color: var(--purple); }
.chip-ok        { background: var(--gdim); color: var(--green); }
.chip-error     { background: var(--rdim); color: var(--red); }

.sp-tok  { font-size: 10px; color: var(--yellow); flex-shrink: 0; }
.sp-lat  { font-size: 10px; color: var(--muted); flex-shrink: 0; min-width: 48px; text-align: right; }

.bar-wrap { width: 60px; flex-shrink: 0; }
.bar      { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 2px; transition: width .4s ease; }
.bar-llm  { background: var(--accent); }
.bar-tool { background: var(--purple); }
.bar-root { background: var(--cyan); }
.bar-misc { background: var(--muted); }

.sp-chev { font-size: 9px; color: var(--dim); transition: transform .15s; flex-shrink: 0; }
.sp-chev.open { transform: rotate(90deg); }

/* Span detail */
.sp-detail {
  display: none;
  border-top: 1px solid var(--border);
  padding: 12px;
  background: var(--bg);
  font-size: 11px;
  gap: 10px;
  flex-direction: column;
}
.sp-detail.open { display: flex; }

.ds  { display: flex; flex-direction: column; gap: 5px; }
.dl  { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }

.dcode {
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px;
  font-size: 11px;
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 160px;
  overflow-y: auto;
}
.dcode.prompt     { color: #a5b4fc; }
.dcode.completion { color: var(--green); }

.ids-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.id-box { background: var(--surf); border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px; }
.ik { font-size: 9px; color: var(--muted); margin-bottom: 2px; }
.iv { font-size: 10px; color: var(--cyan); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.attr-pills { display: flex; flex-wrap: wrap; gap: 4px; }
.pill { background: var(--surf); border: 1px solid var(--border); border-radius: 4px; padding: 3px 7px; font-size: 10px; }
.pk   { color: var(--muted); }
.pv   { color: var(--text); }

/* Tool call events */
.events-list { display: flex; flex-direction: column; gap: 6px; }
.ev-item {
  display: flex;
  gap: 8px;
  padding: 8px 10px;
  background: rgba(187,154,247,.06);
  border: 1px solid rgba(187,154,247,.15);
  border-radius: 5px;
  font-size: 11px;
}
.ev-icon  { color: var(--purple); flex-shrink: 0; font-size: 13px; }
.ev-name  { font-weight: 600; color: var(--purple); margin-bottom: 3px; }
.ev-attr  { font-size: 10px; color: var(--muted); }
.ev-attr b { color: var(--text); }

@keyframes fadein { from { opacity:0; transform:translateY(3px); } to { opacity:1; } }
.fi { animation: fadein .18s ease forwards; }
.spin { display: inline-block; animation: spinr .7s linear infinite; }
@keyframes spinr { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <div id="sb-head">
    <div class="wordmark">
      <div class="wm-icon">E</div>
      <div>
        <div class="wm-name">EvalKit</div>
        <div class="wm-sub">Trace Dashboard</div>
      </div>
    </div>
    <div class="sb-row">
      <span class="cap">Traces</span>
      <button class="icon-btn" onclick="loadTraces(true)"><span id="ref-icon">↻</span> refresh</button>
    </div>
    <div id="last-ref" style="font-size:9px;color:var(--dim)">—</div>
  </div>

  <div id="trace-list">
    <div style="padding:10px;color:var(--dim)">loading…</div>
  </div>

  <div id="sb-foot">
    <span><span class="live-dot"></span>auto 10s</span>
    <a class="demo-link" href="/" target="_blank">← demo app</a>
    <span id="tr-count">0 traces</span>
  </div>
</div>

<!-- Main panel -->
<div id="main">
  <div class="p-head">
    <span class="p-title">Trace Detail</span>
    <span id="tp-id">— click a trace —</span>
  </div>

  <div id="stats-bar" style="display:none"></div>

  <div id="trace-body">
    <div id="no-trace">
      <div class="nt-icon">◈</div>
      <div style="font-size:11px">Select a trace from the sidebar</div>
    </div>
    <div id="waterfall" style="display:none"></div>
  </div>
</div>

<script>
'use strict';

const API = '';
let traceIds = [];
let activeId = null;

/* ── Sidebar ────────────────────────────────────────────── */

async function loadTraces(manual = false) {
  if (manual) document.getElementById('ref-icon').className = 'spin';
  try {
    const r = await fetch(`${API}/api/traces`);
    const d = await r.json();
    traceIds = d.traces || [];
    renderSidebar();
    document.getElementById('last-ref').textContent =
      'updated ' + new Date().toLocaleTimeString('en-US', { hour12: false });
    document.getElementById('tr-count').textContent =
      `${traceIds.length} trace${traceIds.length !== 1 ? 's' : ''}`;
  } catch {
    document.getElementById('trace-list').innerHTML =
      '<div style="padding:10px;color:var(--red);font-size:10px">connection error</div>';
  } finally {
    const ic = document.getElementById('ref-icon');
    ic.className = '';
    ic.textContent = '↻';
  }
}

function renderSidebar() {
  const list = document.getElementById('trace-list');
  if (!traceIds.length) {
    list.innerHTML = '<div style="padding:10px;color:var(--dim);font-size:10px;line-height:1.6">No traces yet.<br>Use the <a href="/" style="color:var(--accent)">demo app</a> to generate one.</div>';
    return;
  }
  list.innerHTML = [...traceIds].reverse().map(id => `
    <div class="tr-item ${id === activeId ? 'active' : ''}" onclick="pickTrace('${id}', this)">
      <div class="tr-short">${id.slice(0, 8)}…</div>
      <div class="tr-full">${id}</div>
    </div>`).join('');
}

function pickTrace(id, el) {
  document.querySelectorAll('.tr-item').forEach(e => e.classList.remove('active'));
  if (el) el.classList.add('active');
  activeId = id;
  loadTrace(id);
}

/* ── Trace detail ───────────────────────────────────────── */

async function loadTrace(id) {
  document.getElementById('tp-id').textContent = id;
  document.getElementById('no-trace').style.display = 'none';
  document.getElementById('stats-bar').style.display = 'none';

  const wf = document.getElementById('waterfall');
  wf.style.display = 'flex';
  wf.style.flexDirection = 'column';
  wf.innerHTML = '<div style="color:var(--dim);padding:8px;font-size:11px">loading…</div>';

  try {
    const r = await fetch(`${API}/api/traces/${id}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    renderTrace(id, await r.json());
  } catch (e) {
    wf.innerHTML = `<div style="color:var(--red);padding:8px;font-size:11px">Error: ${esc(e.message)}</div>`;
  }
}

function renderTrace(id, spans) {
  const wf = document.getElementById('waterfall');

  if (!Array.isArray(spans) || !spans.length) {
    wf.innerHTML = '<div style="color:var(--dim);padding:8px;font-size:11px">No spans — they may still be flushing. Refresh in a moment.</div>';
    return;
  }

  spans.sort((a, b) =>
    new Date(a.startTime || a.start_time || a.createdAt || 0) -
    new Date(b.startTime || b.start_time || b.createdAt || 0)
  );

  const totalLat = spans.reduce((s, sp) => s + (sp.latencyMs || sp.latency_ms || 0), 0);
  const totalIn  = spans.reduce((s, sp) => s + (sp.tokensIn  || sp.tokens_in  || 0), 0);
  const totalOut = spans.reduce((s, sp) => s + (sp.tokensOut || sp.tokens_out || 0), 0);
  const llmCount = spans.filter(sp => (sp.spanType || sp.span_type) === 'llm_call').length;
  const toolCount= spans.filter(sp => (sp.spanType || sp.span_type) === 'tool_call').length;
  const hasErr   = spans.some(sp => sp.status === 'ERROR');

  const sb = document.getElementById('stats-bar');
  sb.style.display = 'flex';
  sb.innerHTML = `
    <div class="sb-blk"><div class="sv">${spans.length}</div><div class="sl">Spans</div></div>
    <div class="sb-blk"><div class="sv accent">${llmCount}</div><div class="sl">LLM calls</div></div>
    <div class="sb-blk"><div class="sv" style="color:var(--purple)">${toolCount}</div><div class="sl">Tool calls</div></div>
    <div class="sb-blk"><div class="sv yellow">${totalLat}ms</div><div class="sl">Latency</div></div>
    <div class="sb-blk"><div class="sv">${totalIn + totalOut}</div><div class="sl">Tokens</div></div>
    <div class="sb-blk"><div class="sv ${hasErr ? 'red' : 'green'}">${hasErr ? 'ERR' : 'OK'}</div><div class="sl">Status</div></div>`;

  const maxLat = Math.max(...spans.map(sp => sp.latencyMs || sp.latency_ms || 0), 1);

  wf.innerHTML = spans.map((sp, i) => {
    const type   = sp.spanType  || sp.span_type  || 'misc';
    const op     = sp.operation || type;
    const prov   = sp.provider  || '';
    const lat    = sp.latencyMs || sp.latency_ms || 0;
    const tIn    = sp.tokensIn  || sp.tokens_in  || 0;
    const tOut   = sp.tokensOut || sp.tokens_out || 0;
    const isRoot = !(sp.parentSpanId || sp.parent_span_id);
    const pct    = Math.round((lat / maxLat) * 100);

    const icoClass = type === 'llm_call'  ? 'ico-llm'
                   : type === 'tool_call' ? 'ico-tool'
                   : isRoot              ? 'ico-root' : 'ico-misc';
    const icoChar  = type === 'llm_call'  ? '◈'
                   : type === 'tool_call' ? '⚙'
                   : isRoot              ? '◆' : '◎';
    const barCls   = type === 'llm_call'  ? 'bar-llm'
                   : type === 'tool_call' ? 'bar-tool'
                   : isRoot              ? 'bar-root' : 'bar-misc';

    const provChip  = prov ? `<span class="chip chip-${prov}">${prov}</span>` : '';
    const typeChip  = type !== 'misc' ? `<span class="chip chip-${type}">${type.replace('_', ' ')}</span>` : '';
    const tokStr    = (tIn || tOut) ? `${tIn}↑ ${tOut}↓` : '';
    const indent    = (!isRoot) ? 'padding-left:14px;border-left:2px solid var(--border);margin-left:10px;' : '';

    return `
    <div class="sp-row fi" style="${indent}animation-delay:${i * .04}s">
      <div class="sp-head" onclick="toggleSpan(${i})">
        <div class="sp-ico ${icoClass}">${icoChar}</div>
        <div class="sp-op">${esc(op)}</div>
        ${provChip}
        ${typeChip}
        ${tokStr ? `<span class="sp-tok">${tokStr}</span>` : ''}
        <span class="sp-lat">${lat}ms</span>
        <div class="bar-wrap"><div class="bar"><div class="bar-fill ${barCls}" style="width:${pct}%"></div></div></div>
        <span class="sp-chev" id="chev-${i}">▶</span>
      </div>
      <div class="sp-detail" id="sd-${i}">${buildDetail(sp)}</div>
    </div>`;
  }).join('');
}

function toggleSpan(i) {
  const d = document.getElementById(`sd-${i}`);
  const c = document.getElementById(`chev-${i}`);
  d.classList.toggle('open');
  c.classList.toggle('open', d.classList.contains('open'));
}

function buildDetail(sp) {
  const prompt     = sp.prompt     || '';
  const completion = sp.completion || '';
  const spanId     = sp.spanId     || sp.span_id       || '—';
  const parentId   = sp.parentSpanId || sp.parent_span_id || '';
  const service    = sp.serviceName  || sp.service_name  || '—';
  const start      = fmt(sp.startTime || sp.start_time);
  const end        = fmt(sp.endTime   || sp.end_time);
  const attrs      = parseField(sp.attributes);
  const events     = parseField(sp.events, []);
  const attrKeys   = Object.keys(attrs).filter(k => !k.startsWith('evalkit.internal'));

  let html = `<div class="ds">
    <div class="dl">Identifiers</div>
    <div class="ids-grid">
      <div class="id-box"><div class="ik">Span ID</div><div class="iv">${esc(spanId)}</div></div>
      <div class="id-box"><div class="ik">Parent</div><div class="iv">${esc(parentId || '— root')}</div></div>
      <div class="id-box"><div class="ik">Service</div><div class="iv">${esc(service)}</div></div>
      <div class="id-box"><div class="ik">Timing</div><div class="iv">${start} → ${end}</div></div>
    </div>
  </div>`;

  if (prompt)     html += `<div class="ds"><div class="dl">Prompt</div><div class="dcode prompt">${esc(prompt)}</div></div>`;
  if (completion) html += `<div class="ds"><div class="dl">Completion</div><div class="dcode completion">${esc(completion)}</div></div>`;

  if (attrKeys.length) html += `<div class="ds">
    <div class="dl">Attributes</div>
    <div class="attr-pills">${attrKeys.map(k =>
      `<div class="pill"><span class="pk">${esc(k)}: </span><span class="pv">${esc(String(attrs[k]))}</span></div>`
    ).join('')}</div>
  </div>`;

  if (Array.isArray(events) && events.length) html += `<div class="ds">
    <div class="dl">Tool Calls / Events (${events.length})</div>
    <div class="events-list">${events.map(ev => `
      <div class="ev-item">
        <div class="ev-icon">⚙</div>
        <div>
          <div class="ev-name">${esc(ev.name || '')}</div>
          <div class="ev-attr">${
            Object.entries(ev.attributes || {}).map(([k, v]) =>
              `<b>${esc(k)}</b>: ${esc(String(v))}`
            ).join(' &nbsp;·&nbsp; ')
          }</div>
        </div>
      </div>`).join('')}
    </div>
  </div>`;

  return html || '<div style="color:var(--dim);font-size:10px">No details</div>';
}

/* ── Utils ──────────────────────────────────────────────── */

function parseField(v, fallback = {}) {
  if (!v) return fallback;
  if (typeof v === 'object') return v;
  try { return JSON.parse(v); } catch { return fallback; }
}

function fmt(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleTimeString('en-US', {
      hour12: false, hour: '2-digit', minute: '2-digit',
      second: '2-digit', fractionalSecondDigits: 2
    });
  } catch { return iso; }
}

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ── Init ───────────────────────────────────────────────── */
loadTraces();
setInterval(() => loadTraces(false), 10000);

if (location.hash) {
  const id = location.hash.slice(1);
  setTimeout(() => {
    const el = document.querySelector(`[onclick*="${id}"]`);
    pickTrace(id, el);
  }, 800);
}
</script>
